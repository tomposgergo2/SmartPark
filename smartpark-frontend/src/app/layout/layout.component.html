<div class="app-shell">
  <button class="mobile-toggle" (click)="toggleSidebar()">☰</button>

  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="brand">
      <div class="brand-icon">P</div>
      <div>
        <h1>ParkSmart</h1>
        <p>Parking Management</p>
      </div>
    </div>

    <nav class="nav-links">
      @for (item of filteredNavigation(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" (click)="closeSidebar()">{{ item.name }}</a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="avatar">{{ user()?.name?.[0] }}</div>
      <div class="user-meta">
        <strong>{{ user()?.name }}</strong>
        <span class="role-badge">{{ user()?.role }}</span>
      </div>
      <button class="ghost-btn" (click)="logout()">Logout</button>
    </div>
  </aside>

  @if (sidebarOpen()) {
    <div class="overlay" (click)="closeSidebar()"></div>
  }

  <div class="content-area">
    <header class="topbar">
      <div>
        <h2>{{ pageTitle() }}</h2>
      </div>
      @if (user()?.role === 'user') {
        <div class="balance-box">
          <span>Balance</span>
          <strong>${{ user()?.balance?.toFixed(2) }}</strong>
        </div>
      }
    </header>

    <main class="page-wrap">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
