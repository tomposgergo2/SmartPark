<div class="section-stack">
  <section class="card">
    <div class="section-head"><div><h3>My Vehicles</h3><p class="muted">Manage your registered vehicles</p></div></div>
    <div class="list-stack">
      @for (vehicle of vehicles; track vehicle.id) {
        <div class="list-card">
          <div>
            <strong>{{ vehicle.licensePlate }}</strong>
            <p class="muted">{{ vehicle.color }} {{ vehicle.make }} {{ vehicle.model }}</p>
          </div>
          <button class="danger-outline-btn" (click)="removeVehicle(vehicle.id)">Delete</button>
        </div>
      }
    </div>
  </section>

  <section class="card">
    <h3>Add Vehicle</h3>
    <div class="form-grid two-columns">
      <input [(ngModel)]="form.licensePlate" placeholder="License Plate">
      <input [(ngModel)]="form.make" placeholder="Make">
      <input [(ngModel)]="form.model" placeholder="Model">
      <input [(ngModel)]="form.color" placeholder="Color">
    </div>
    <button class="primary-btn" (click)="addVehicle()">Add Vehicle</button>
  </section>
</div>
